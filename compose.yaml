services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: media_intelligence
      POSTGRES_USER: media_intelligence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_intelligence -d media_intelligence"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://media_intelligence:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db/media_intelligence
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://media_intelligence:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db/media_intelligence
      ORGANIZATION_ID: ${ORGANIZATION_ID:?Set ORGANIZATION_ID}
      LOCAL_API_TOKEN: ${LOCAL_API_TOKEN:?Set LOCAL_API_TOKEN}
      DIRECTORY_FILE: /config/directory.json
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./config/directory.json:/config/directory.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped

volumes:
  postgres_data:
