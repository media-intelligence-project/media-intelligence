[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "media-intelligence"
version = "0.1.0"
description = "Organization-scoped media observations and package exchange"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.11.4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
